[project]
name = "zapisi"
version = "0.1.0"
description = "Personal finance TUI with password-free local profile databases"
readme = "README.md"
authors = [
    { name = "Aditya Gupta", email = "adityagupta2087@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "sqlmodel>=0.0.42",
    "textual>=8.2.8",
]

[dependency-groups]
build = ["pyinstaller>=6.22.2"]
dev = ["ruff>=0.14.0"]

[project.scripts]
zappyz = "zapisi:main"
zapisi = "zapisi:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
